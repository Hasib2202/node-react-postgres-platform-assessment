# Prometheus (single instance, 6h retention, ephemeral storage) + alert rules.
# Scrapes: backend pods (annotation based), ingress-nginx controller, cAdvisor
# (container CPU/memory via the kubelet) and kube-state-metrics (replica counts).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      # Backend API pods that carry prometheus.io/* annotations (namespace dev)
      - job_name: backend
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [dev] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

      # ingress-nginx controller (request rate / status codes / latency at the edge)
      - job_name: ingress-nginx
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [ingress-nginx] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            action: keep
            regex: controller
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:10254
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Container CPU / memory from cAdvisor, through the API server proxy
      - job_name: cadvisor
        scheme: https
        tls_config: { insecure_skip_verify: true }
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

      # Deployment/HPA replica counts
      - job_name: kube-state-metrics
        static_configs:
          - targets: [kube-state-metrics.monitoring.svc:8080]
  rules.yml: |
    groups:
      - name: backend-alerts
        rules:
          - alert: BackendHighErrorRate
            expr: |
              sum(rate(http_requests_total{app="backend",status=~"5.."}[5m]))
                / clamp_min(sum(rate(http_requests_total{app="backend"}[5m])), 0.001) > 0.05
            for: 5m
            labels: { severity: page }
            annotations:
              summary: "More than 5% of API requests are failing (5xx) for 5 minutes"
          - alert: BackendHighLatencyP95
            expr: |
              histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{app="backend"}[5m]))) > 0.5
            for: 10m
            labels: { severity: warn }
            annotations:
              summary: "API p95 latency above 500ms for 10 minutes"
          - alert: BackendHighCPU
            expr: |
              sum(rate(container_cpu_usage_seconds_total{namespace="dev",pod=~"backend-.*",container="backend"}[5m]))
                / sum(kube_pod_container_resource_limits{namespace="dev",pod=~"backend-.*",resource="cpu"}) > 0.8
            for: 10m
            labels: { severity: warn }
            annotations:
              summary: "Backend CPU above 80% of limits - HPA at max replicas or too slow to scale"
          - alert: BackendMemoryNearLimit
            expr: |
              max(container_memory_working_set_bytes{namespace="dev",pod=~"backend-.*",container="backend"})
                / max(kube_pod_container_resource_limits{namespace="dev",pod=~"backend-.*",resource="memory"}) > 0.9
            for: 10m
            labels: { severity: warn }
            annotations:
              summary: "Backend memory above 90% of limit - OOMKill risk (possible leak)"
          - alert: BackendReplicasUnavailable
            expr: kube_deployment_status_replicas_available{namespace="dev",deployment="backend"} < kube_deployment_spec_replicas{namespace="dev",deployment="backend"}
            for: 5m
            labels: { severity: page }
            annotations:
              summary: "Backend has fewer ready replicas than desired"
          - alert: BackendPodRestarting
            expr: increase(kube_pod_container_status_restarts_total{namespace="dev",pod=~"backend-.*"}[15m]) > 2
            labels: { severity: warn }
            annotations:
              summary: "Backend container restarted more than twice in 15 minutes (crash loop / failing liveness)"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels: { app: prometheus }
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --web.enable-lifecycle
          ports:
            - { name: web, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /-/ready, port: web }
          livenessProbe:
            httpGet: { path: /-/healthy, port: web }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
            - { name: config, mountPath: /etc/prometheus/rules/rules.yml, subPath: rules.yml }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: ClusterIP
  selector: { app: prometheus }
  ports:
    - { name: web, port: 9090, targetPort: web }
