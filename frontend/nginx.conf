server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Liveness/readiness endpoint for Kubernetes and Compose healthchecks.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Runtime config must never be cached - it changes with the environment.
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  # Hashed build assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback.
  location / {
    try_files $uri /index.html;
  }
}
