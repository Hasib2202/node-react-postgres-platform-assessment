# ClusterIP: external access goes through the Ingress (ingress-dev.yaml).
# For a no-ingress demo change to `type: NodePort` and set `nodePort: 30080`.
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: dev
spec:
  type: ClusterIP
  selector: { app: frontend }
  ports:
    - { name: http, port: 80, targetPort: http }
