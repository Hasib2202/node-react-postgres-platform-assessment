# OpenSearch in single-node dev mode (security plugin off, ephemeral storage).
# Production would use a StatefulSet, TLS/auth and an operator/Helm chart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: dev
  labels: { app: search }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: search }
  template:
    metadata:
      labels: { app: search }
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.15.0
          ports:
            - { name: http, containerPort: 9200 }
          env:
            - { name: discovery.type, value: single-node }
            - { name: DISABLE_SECURITY_PLUGIN, value: "true" }
            - { name: DISABLE_INSTALL_DEMO_CONFIG, value: "true" }
            - { name: OPENSEARCH_JAVA_OPTS, value: "-Xms256m -Xmx256m" }
          readinessProbe:
            httpGet: { path: "/_cluster/health?local=true", port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 640Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /usr/share/opensearch/data }
      volumes:
        - name: data
          emptyDir: {}
