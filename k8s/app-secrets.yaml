# DEV-ONLY throwaway credentials for the local kind cluster. Never reuse them.
# For shared environments CI creates this Secret from GitHub Actions secrets
# (see .github/workflows/ci-cd.yml) and this file is NOT part of kustomization.yaml.
# Applied explicitly by scripts/kind-up.sh.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: dev
type: Opaque
stringData:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: dev-only-password
  DB_USER: app
  DB_PASSWORD: dev-only-password
  # Simulated cluster: write -> primary service, read -> "replica" service
  DB_WRITE_URL: postgres://app:dev-only-password@postgres-service:5432/appdb
  DB_READ_URL: postgres://app:dev-only-password@postgres-read-service:5432/appdb
